name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: npm ci

      # Both packages type-check here: frontend runs `tsc --noEmit`,
      # worker runs `wrangler types --check && tsc --noEmit`.
      #
      # `wrangler types` folds every key in worker/.dev.vars into the generated
      # env interface, and that file is gitignored. Without it CI derives a
      # different Env than the committed worker-configuration.d.ts (which was
      # generated from the five bindings below), so `--check` can never pass.
      # Seeding the same key set with placeholder values keeps CI aligned with
      # the committed declaration without shipping any real secret.
      #
      # Two things future editors must not "clean up":
      #   1. Keep SUPABASE_URL in the seed. It shadows the literal from
      #      `[vars]` in wrangler.toml; dropping it flips the generated type
      #      back to the string literal and `--check` fails again.
      #   2. Only the KEY SET matters, not the values -- but adding or removing
      #      a key also requires regenerating worker-configuration.d.ts.
      # wrangler 4.116.0 has no flag to skip .dev.vars for `types`
      # (`--env-file` only adds a file), so seeding is the only way in.
      - name: Seed CI env bindings
        run: |
          cat > worker/.dev.vars <<'EOF'
          CF_API_TOKEN=ci-placeholder
          CF_ACCOUNT_ID=ci-placeholder
          JWT_SECRET=ci-placeholder
          SUPABASE_SECRET_KEY=ci-placeholder
          SUPABASE_URL=ci-placeholder
          EOF

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # `npm test` chains test:js (node --test across the repo)
      # and test:go. The gate is the exit code -- never the output line count:
      # node --test prints per-file for top-level bare assertions and per-test for
      # test() files, so counting lines silently misses whole files.
      - name: Test
        run: npm test

      # These fixtures drop to nobody to check real filesystem access.
      # Their service commands are isolated; the normal runner skips them.
      - name: Installer service account permissions
        run: |
          sudo "$(command -v node)" --test --test-name-pattern='^compat (systemd|openrc) (default paths|must not open permissions)' agent/install-compat.test.mjs
          sudo "$(command -v node)" --test --test-name-pattern='^native ' agent/disk-collector-install.test.mjs

      - name: Agent root collector permissions
        working-directory: agent
        run: |
          go test -c -o "$RUNNER_TEMP/cf-monitor-agent-native.test" .
          sudo sh -s -- "$RUNNER_TEMP/cf-monitor-agent-native.test" <<'NATIVE'
          set -eu
          native_dir="$(mktemp -d /run/cf-monitor-agent-native.XXXXXX)"
          cleanup() {
            native_status=$?
            trap - EXIT HUP INT TERM
            case "$native_dir" in /run/cf-monitor-agent-native.??????) ;; *) exit 98 ;; esac
            [ "$(readlink -f -- "$native_dir")" = "$native_dir" ] || exit 99
            rm -rf -- "$native_dir"
            exit "$native_status"
          }
          trap cleanup EXIT HUP INT TERM
          chmod 0755 "$native_dir"
          install -m 0755 "$1" "$native_dir/agent.test"
          mkdir -m 0755 "$native_dir/tmp"
          TMPDIR="$native_dir/tmp" "$native_dir/agent.test" -test.run '^TestDirectoryDiskNative' -test.v
          NATIVE

      - name: Agent data race check
        working-directory: agent
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

      # ── 依赖安全扫描（阻断，但基于显式基线）──────────────────────────────
      # 本仓从上游 kadidalax/cf-vps-monitor v2.0.3 继承了若干依赖漏洞
      # （移植期提交从未改动 package.json / package-lock.json / go.mod / go.sum，
      #  可用 git log 核对）。origin 版本要求 audit total === 0，于是整条流水线
      # 长期卡在这一步，连后面的 `Check migration drift` 都从未真正执行过。
      #
      # 处理方式不是 continue-on-error（那会把新增漏洞一起放行），而是
      # `scripts/security-baseline.json` 的**显式基线**：
      #   · 基线内列出的 advisory → 放行，并在日志里逐条列出；
      #   · 出现任何**新** advisory → 照常失败，阻断流水线与 Agent 发布；
      #   · 基线条目已被修复 → 日志提示清理，不静默失效。
      # 因此本步骤仍然是硬门禁，`release-agent.yml` 通过 `uses: ./ci.yml`
      # 复用它的结论也依然成立。
      #
      # 已修复 4 个根因包（改前 22 条 advisory / 8 个受影响包 → 改后 6 条 / 2 个包）：
      #   undici 7.30.1 / sharp 0.35.5 / source-map-js 1.2.2 / hono 4.13.14。
      #   其中 undici 7.29.0 一个包就挂了 13 条 advisory。
      #   注意 miniflare 与 wrangler 没有自身漏洞，只是依赖了上面两个才被标记，
      #   故未升级它们 —— 升 wrangler 会改变 `wrangler types` 的口径，
      #   反而会打破 Lint 步骤的约定。
      # 仍留在基线里的 6 条 advisory（vite 5 + postcss-selector-parser 1，共 2 个包）
      # 及原因见 scripts/security-baseline.json 的 blockedBy 字段。
      #
      # 本地复查（npmmirror 不支持 audit 端点，必须显式指定官方 registry）：
      #   npm audit --include=dev --registry=https://registry.npmjs.org
      - name: Dependency and toolchain security
        run: npm run security:check

      - name: Check migration drift
        run: |
          npm run build:migrations
          git diff --exit-code -- supabase/ worker/src/generated/

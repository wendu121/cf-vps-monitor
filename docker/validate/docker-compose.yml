# 本地验证专用 Docker 拓扑（非生产）。
# 生产目标 = Cloudflare Workers + 托管 Supabase（见仓库根 DEPLOY.md）。
# 这里用 postgres + postgrest + nginx 在本地复刻 Supabase 的 Kong→PostgREST 路由，
# 以便在不依赖托管 Supabase 的情况下端到端验证 cf-vps-monitor 的数据层与 Worker HTTP 层。

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cfmonitor
    ports:
      - "5445:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../../supabase/migrations:/migrations:ro
      - ./post-migrate.sql:/post-migrate.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cfmonitor"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/cfmonitor
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: service_role
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: "local-validation-only-jwt-secret-change-me"
      PGRST_SERVER_PORT: 3000
    expose:
      - "3000"
    restart: on-failure

  # Kong 替身：把 /rest/v1/<path> 重写为 /<path> 转发给 postgrest，
  # 使本地环境与 Worker 里 `${SUPABASE_URL}/rest/v1/...` 的拼接方式完全一致。
  proxy:
    image: nginx:alpine
    depends_on:
      - postgrest
    ports:
      - "8455:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure

volumes:
  dbdata:
